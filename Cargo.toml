[package]
name = "archie-discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
serenity = { git = "https://github.com/ZiYueCommentary/serenity.git", branch = "feature-current/ws-proxy", features = ["client", "gateway", "rustls_backend", "model"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
serde_json = "1.0.151"
tracing-appender = "0.2.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }

[patch.crates-io]
serenity = { git = "https://github.com/ZiYueCommentary/serenity.git", branch = "feature-current/ws-proxy" }
